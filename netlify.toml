# Netlify: static game from public/ + the leaderboard function at /api/scores.
[build]
  publish = "public"
  functions = "netlify/functions"
  command = ""

# The old Netlify address sends everyone to the custom domain (keeping the path and any
# ?query, e.g. /stats.html?key=...). Only this exact host is matched, so deploy previews
# and branch URLs (main--aberfeldy-jobbie-dash.netlify.app) keep working.
[[redirects]]
  from = "https://aberfeldy-jobbie-dash.netlify.app/*"
  to = "https://jobbie.run/:splat"
  status = 301
  force = true

# Browser security headers: only this site's own scripts and Google Fonts may load, the pages
# can't be framed by another site, and nothing is sent in the Referer header beyond the origin.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# The private stats page: never cached, never indexed, never leaks its address.
[[headers]]
  for = "/stats.html"
  [headers.values]
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex"
